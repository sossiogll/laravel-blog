name: CI

on:
  push:
    branches: [next]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # .env.example targets the Docker stack; the CI has neither Redis nor MariaDB.
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, zip, gd, bcmath, exif

      - name: Install
        run: |
          cp .env.example .env
          .github/scripts/annotate-failure.sh "Composer install failed" composer install --no-interaction --prefer-dist

      - name: Core tests
        run: |
          php artisan key:generate
          .github/scripts/annotate-failure.sh "Core tests failed" php artisan test

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install
        run: ../.github/scripts/annotate-failure.sh "Composer install failed" composer install --no-interaction --prefer-dist

      - name: Contract tests
        run: ../.github/scripts/annotate-failure.sh "Contract tests failed" vendor/bin/phpunit

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HOST_UID: 1001
      HOST_GID: 118
      COMPOSE_FILE: docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v5

      - name: Lint the scripts
        run: shellcheck docker/app/*.sh .github/scripts/annotate-failure.sh

      - name: Start the dev stack
        run: |
          mkdir ../gllhub-packages
          .github/scripts/annotate-failure.sh "Stack did not start" \
            bash -c 'docker compose up --build --wait --wait-timeout 900 >/tmp/up.log 2>&1 || { docker compose logs --tail 15; docker compose ps -a; tail -n 12 /tmp/up.log; exit 1; }'

      - name: Admin panel answers
        run: |
          .github/scripts/annotate-failure.sh "Admin panel not reachable" \
            bash -c 'curl -fsSL -o /dev/null http://localhost:8000/admin/login && docker compose exec -T app php -m | grep -E "^(redis|pdo_mysql|intl|gd|pcntl|zip|bcmath|exif)$"'

      - name: Xdebug is installed and off, and can be switched on
        run: |
          .github/scripts/annotate-failure.sh "Xdebug setup is wrong" \
            bash -c 'docker compose exec -T app php -r "exit(extension_loaded(\"xdebug\") && xdebug_info(\"mode\") === [] ? 0 : 1);" \
              && docker compose exec -T -e XDEBUG_MODE=debug app php -r "exit(xdebug_info(\"mode\") === [\"debug\"] && ini_get(\"xdebug.client_host\") === \"host.docker.internal\" && ini_get(\"xdebug.client_port\") === \"9003\" ? 0 : 1);" \
              && docker compose exec -T app getent hosts host.docker.internal'

      - name: Vite serves the assets to the browser on the host
        run: |
          .github/scripts/annotate-failure.sh "Vite is not reachable from the host" \
            bash -c 'curl -fsS http://localhost:5173/@vite/client >/dev/null && cat public/hot && [ "$(cat public/hot)" = "http://localhost:5173" ]'

      - name: The queue restarts when PHP code changes
        run: |
          .github/scripts/annotate-failure.sh "The queue did not restart" \
            bash -c 'touch app/Providers/AppServiceProvider.php && sleep 15 && docker compose logs queue | grep "watch-restart: .*changed, restarting" && docker compose exec -T queue php artisan horizon:status'

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  docker-prod:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GLLHUB_IMAGES: local
      GLLHUB_VERSION: ci
      GLLHUB_PORT: 8080
    steps:
      - uses: actions/checkout@v5

      - name: Build the production image
        run: .github/scripts/annotate-failure.sh "Production image did not build" docker build --file docker/app/Dockerfile --target prod --tag local/gllhub:ci .

      - name: Start the production stack
        run: |
          cp .env.production.example .env
          sed -i -e "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" \
                 -e 's|^APP_URL=.*|APP_URL=http://localhost:8080|' \
                 -e 's|^DB_PASSWORD=.*|DB_PASSWORD=ci-password|' \
                 -e 's|^DB_ROOT_PASSWORD=.*|DB_ROOT_PASSWORD=ci-root-password|' .env
          .github/scripts/annotate-failure.sh "Production stack did not start" \
            bash -c 'docker compose up -d --wait --wait-timeout 300 >/tmp/up.log 2>&1 || { docker compose logs --tail 15; docker compose ps -a; tail -n 12 /tmp/up.log; exit 1; }'

      - name: The application answers
        run: |
          .github/scripts/annotate-failure.sh "Production application not reachable" \
            bash -c 'curl -fsS http://localhost:8080/up >/dev/null && curl -fsSL -o /dev/null http://localhost:8080/admin/login'

      - name: The image is a production image
        run: |
          .github/scripts/annotate-failure.sh "Production image is not as expected" \
            bash -c '[ "$(docker compose ps -a --format "{{.Service}} {{.ExitCode}}" init)" = "init 0" ] \
              && [ "$(docker compose exec -T app id -u)" != 0 ] \
              && ! docker compose exec -T app php -m | grep -i xdebug \
              && docker compose exec -T app php -m | grep -F "Zend OPcache" \
              && docker compose exec -T app php -r "exit(ini_get(\"opcache.validate_timestamps\") === \"0\" ? 0 : 1);" \
              && docker compose exec -T queue php artisan horizon:status | grep -i running'

      - name: Stop the stack
        if: always()
        run: docker compose down -v
