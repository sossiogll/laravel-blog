# Development stack: `docker compose -f docker-compose.dev.yml up`. Production is docker-compose.yml.
# The sources are mounted, so PHP changes apply at once; the queue and scheduler restart on PHP changes
# (docker/app/watch-restart.sh) and Vite hot-reloads the assets.
# HOST_UID / HOST_GID make files created in the containers belong to you on Linux:
#   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose -f docker-compose.dev.yml up --build
# XDEBUG_MODE=debug (in .env or the shell) turns Xdebug on; see the README.

x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    target: dev
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: gllhub-dev
  environment:
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
  extra_hosts:
    # Docker Desktop defines it already; on Linux this makes it point at the host.
    - "host.docker.internal:host-gateway"
  volumes:
    - .:/app
    - ../gllhub-packages:/gllhub-packages:ro

services:
  app:
    <<: *app
    environment:
      BOOTSTRAP: "1"
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 5
      # The first start runs composer install.
      start_period: 600s

  queue:
    <<: *app
    command: ["watch-restart", "php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["watch-restart", "php", "artisan", "schedule:work"]
    healthcheck:
      # [w]: keeps the shell running this check from matching itself.
      test: ["CMD-SHELL", "grep -qs 'schedule:[w]ork' /proc/[0-9]*/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy

  vite:
    image: node:22
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    environment:
      # The container user has no home directory.
      npm_config_cache: /tmp/.npm
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: ["sh", "-c", "npm install && npm run dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/@vite/client').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 300s

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: gllhub
      MARIADB_USER: gllhub
      MARIADB_PASSWORD: gllhub
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  db:
